<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ROPERO — Control de Ropa</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0f14;
      --surface: #161820;
      --surface2: #1e2028;
      --border: #2a2d38;
      --accent: #e8ff47;
      --accent2: #47b8ff;
      --accent3: #ff6b47;
      --text: #f0f2f8;
      --muted: #6b7090;
      --success: #47ffa0;
      --radius: 12px;
      --mono: 'Space Mono', monospace;
      --sans: 'Syne', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ===== HEADER ===== */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13,15,20,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: var(--sans);
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.5px;
    }
    .logo span { color: var(--accent); }

    .header-actions { display: flex; gap: 10px; }

    /* ===== NAV TABS ===== */
    .nav-tabs {
      display: flex;
      gap: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      flex: 1;
      min-width: 80px;
      padding: 14px 10px;
      background: none;
      border: none;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ===== VIEWS ===== */
    .view { display: none; padding: 20px; }
    .view.active { display: block; }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: var(--radius);
      border: none;
      font-family: var(--sans);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--accent);
      color: #0d0f14;
    }
    .btn-primary:hover { background: #d4e83a; transform: translateY(-1px); }
    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger {
      background: rgba(255,107,71,0.15);
      color: var(--accent3);
      border: 1px solid rgba(255,107,71,0.3);
    }
    .btn-sm { padding: 8px 14px; font-size: 12px; }
    .btn-icon {
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-icon:hover { border-color: var(--accent); color: var(--accent); }

    /* ===== CARDS ===== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    /* ===== STATS GRID ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      position: relative;
      overflow: hidden;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
    }
    .stat-card.yellow::before { background: var(--accent); }
    .stat-card.blue::before { background: var(--accent2); }
    .stat-card.orange::before { background: var(--accent3); }
    .stat-card.green::before { background: var(--success); }

    .stat-number {
      font-family: var(--mono);
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 6px;
    }
    .stat-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ===== REGISTRO FORM ===== */
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      padding: 13px 16px;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--accent);
    }
    .form-textarea { min-height: 80px; resize: vertical; }

    /* ===== CATEGORY ITEMS ===== */
    .category-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .category-row:last-child { border-bottom: none; }
    .category-emoji { font-size: 24px; width: 36px; text-align: center; }
    .category-name { flex: 1; font-weight: 600; font-size: 15px; }
    .qty-control {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .qty-btn {
      width: 38px;
      height: 38px;
      border: none;
      background: none;
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qty-btn:hover { background: var(--border); }
    .qty-value {
      width: 40px;
      text-align: center;
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
    }

    /* ===== HISTORIAL ===== */
    .registro-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .registro-item:hover { border-color: var(--accent2); }
    .registro-item.expanded { border-color: var(--accent); }

    .reg-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .reg-date-box {
      background: var(--accent);
      color: #0d0f14;
      border-radius: 8px;
      padding: 8px 12px;
      text-align: center;
      min-width: 52px;
    }
    .reg-day { font-family: var(--mono); font-weight: 700; font-size: 20px; line-height: 1; }
    .reg-month { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .reg-info { flex: 1; }
    .reg-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    .reg-summary { font-size: 12px; color: var(--muted); }

    .reg-detail {
      display: none;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .registro-item.expanded .reg-detail { display: block; }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .detail-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface2);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
    }
    .detail-chip-qty {
      font-family: var(--mono);
      font-weight: 700;
      color: var(--accent);
      margin-left: auto;
    }

    /* ===== FOTOS ===== */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    .photo-thumb {
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface2);
      border: 1px solid var(--border);
      cursor: pointer;
      position: relative;
    }
    .photo-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .photo-thumb .del-photo {
      position: absolute;
      top: 4px; right: 4px;
      width: 22px; height: 22px;
      background: rgba(0,0,0,0.7);
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-add {
      aspect-ratio: 1;
      border-radius: 8px;
      background: var(--surface2);
      border: 2px dashed var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      transition: border-color 0.2s;
    }
    .photo-add:hover { border-color: var(--accent); color: var(--accent); }

    /* ===== CATEGORIAS VIEW ===== */
    .cat-list { display: flex; flex-direction: column; gap: 10px; }
    .cat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .cat-emoji-big { font-size: 32px; }
    .cat-info { flex: 1; }
    .cat-info-name { font-weight: 700; font-size: 16px; }
    .cat-info-total { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .cat-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
    }

    /* ===== MODAL LIGHTBOX ===== */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 90vw;
      max-height: 90dvh;
      border-radius: 12px;
    }
    .lightbox-close {
      position: absolute;
      top: 20px; right: 20px;
      width: 44px; height: 44px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50%;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    /* ===== MODAL FORM ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-sheet {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding: 24px 20px 40px;
      width: 100%;
      max-width: 600px;
      max-height: 92dvh;
      overflow-y: auto;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-handle {
      width: 40px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 20px;
    }
    .modal-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state .emoji { font-size: 48px; margin-bottom: 16px; }
    .empty-state h3 { font-size: 18px; color: var(--text); margin-bottom: 8px; }
    .empty-state p { font-size: 14px; }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--success);
      color: #0d0f14;
      padding: 12px 24px;
      border-radius: 100px;
      font-weight: 700;
      font-size: 14px;
      z-index: 500;
      transition: transform 0.3s;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ===== BOTTOM FAB ===== */
    .fab {
      position: fixed;
      bottom: 24px;
      right: 20px;
      width: 58px;
      height: 58px;
      background: var(--accent);
      border: none;
      border-radius: 18px;
      color: #0d0f14;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(232,255,71,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      z-index: 100;
    }
    .fab:hover { transform: scale(1.05); box-shadow: 0 12px 40px rgba(232,255,71,0.45); }

    /* ===== ALERT BADGE ===== */
    .alert-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,107,71,0.15);
      color: var(--accent3);
      border: 1px solid rgba(255,107,71,0.3);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .tag {
      display: inline-block;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      margin-right: 4px;
      margin-bottom: 4px;
    }

    .divider { height: 1px; background: var(--border); margin: 20px 0; }

    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .search-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      padding: 11px 16px;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }

    #photoInput { display: none; }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">ROPE<span>RO</span></div>
  <div class="header-actions">
    <button class="btn-icon" onclick="openModal()">＋</button>
  </div>
</header>

<!-- TABS -->
<nav class="nav-tabs">
  <button class="tab-btn active" onclick="switchTab('dashboard', this)">📊 Inicio</button>
  <button class="tab-btn" onclick="switchTab('registro', this)">📋 Historial</button>
  <button class="tab-btn" onclick="switchTab('categorias', this)">👕 Ropa</button>
  <button class="tab-btn" onclick="switchTab('agregar', this)">＋ Registrar</button>
</nav>

<!-- ============ DASHBOARD ============ -->
<div id="view-dashboard" class="view active">
  <div style="margin-bottom:20px;">
    <div style="font-size:12px;color:var(--muted);margin-bottom:4px;" id="fecha-hoy"></div>
    <h2 class="section-title">Panel Principal</h2>
  </div>

  <div class="stats-grid" id="stats-grid">
    <div class="stat-card yellow">
      <div class="stat-number" id="stat-total">0</div>
      <div class="stat-label">Prendas totales</div>
    </div>
    <div class="stat-card blue">
      <div class="stat-number" id="stat-registros">0</div>
      <div class="stat-label">Registros</div>
    </div>
    <div class="stat-card green">
      <div class="stat-number" id="stat-dias">0</div>
      <div class="stat-label">Días activos</div>
    </div>
    <div class="stat-card orange">
      <div class="stat-number" id="stat-bajo">0</div>
      <div class="stat-label">Stock bajo</div>
    </div>
  </div>

  <div id="alertas-container"></div>

  <div class="card">
    <div class="card-title">Inventario actual por categoría</div>
    <div id="dashboard-cats"></div>
  </div>

  <div class="card">
    <div class="card-title">Último registro</div>
    <div id="ultimo-registro">
      <div class="empty-state" style="padding:20px 0;">
        <div class="emoji">📭</div>
        <p>Sin registros aún</p>
      </div>
    </div>
  </div>
</div>

<!-- ============ HISTORIAL ============ -->
<div id="view-registro" class="view">
  <h2 class="section-title">Historial</h2>
  <div class="search-bar">
    <input type="text" class="search-input" placeholder="Buscar por fecha o categoría..." id="search-input" oninput="renderHistorial()" />
  </div>
  <div id="historial-list"></div>
</div>

<!-- ============ CATEGORIAS ============ -->
<div id="view-categorias" class="view">
  <h2 class="section-title">Mi Ropa</h2>
  <p style="color:var(--muted);font-size:14px;margin-bottom:20px;">Stock actual basado en todos los registros</p>
  <div class="cat-list" id="cat-list"></div>
</div>

<!-- ============ AGREGAR ============ -->
<div id="view-agregar" class="view">
  <h2 class="section-title">Nuevo Registro</h2>
  <div id="form-inline"></div>
</div>

<!-- ============ MODAL ============ -->
<div class="modal-overlay" id="modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">➕ Nuevo Registro</div>
    <div id="modal-form-body"></div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="" />
</div>

<!-- FAB -->
<button class="fab" onclick="openModal()">＋</button>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<input type="file" id="photoInput" accept="image/*" capture="environment" multiple />

<script>
// ===== DATA =====
const CATEGORIAS = [
  { id: 'camisas',    emoji: '👔', nombre: 'Camisas',    alerta: 2 },
  { id: 'playeras',   emoji: '👕', nombre: 'Playeras',   alerta: 3 },
  { id: 'pantalones', emoji: '👖', nombre: 'Pantalones', alerta: 2 },
  { id: 'shorts',     emoji: '🩳', nombre: 'Shorts',     alerta: 2 },
  { id: 'boxers',     emoji: '🩲', nombre: 'Boxers',     alerta: 3 },
  { id: 'calcetines', emoji: '🧦', nombre: 'Calcetines', alerta: 3 },
  { id: 'sudaderas',  emoji: '🧥', nombre: 'Sudaderas',  alerta: 1 },
  { id: 'pijamas',    emoji: '😴', nombre: 'Pijamas',    alerta: 1 },
  { id: 'pants',  emoji: '    👖', nombre: 'Ropa Gym',   alerta: 2 },
  { id: 'otros',      emoji: '📦', nombre: 'Otros',      alerta: 0 },
];

function loadDB() {
  try { return JSON.parse(localStorage.getItem('ropero_db') || '[]'); } catch { return []; }
}
function saveDB(data) { localStorage.setItem('ropero_db', JSON.stringify(data)); }

function getCurrentQty(catId) {
  const db = loadDB();
  let total = 0;
  db.forEach(r => { total += (r.items[catId] || 0); });
  return total;
}

// ===== TABS =====
function switchTab(tab, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + tab).classList.add('active');
  btn.classList.add('active');
  if (tab === 'dashboard') renderDashboard();
  if (tab === 'registro') renderHistorial();
  if (tab === 'categorias') renderCategorias();
  if (tab === 'agregar') renderFormInline();
}

// ===== FORM BUILDER =====
function buildForm(containerId, onSave) {
  const today = new Date().toISOString().split('T')[0];
  const qtys = {};
  CATEGORIAS.forEach(c => { qtys[c.id] = 0; });

  let photosB64 = [];

  const container = document.getElementById(containerId);
  container.innerHTML = `
    <div class="form-group">
      <label class="form-label">📅 Fecha</label>
      <input type="date" class="form-input" id="${containerId}-fecha" value="${today}" />
    </div>
    <div class="form-group">
      <label class="form-label">📝 Nota (opcional)</label>
      <textarea class="form-textarea" id="${containerId}-nota" placeholder="Ej: Lavé la ropa del viaje..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">👕 Cantidades por categoría</label>
      <div id="${containerId}-cats">
        ${CATEGORIAS.map(c => `
          <div class="category-row">
            <div class="category-emoji">${c.emoji}</div>
            <div class="category-name">${c.nombre}</div>
            <div class="qty-control">
              <button class="qty-btn" onclick="changeQty('${containerId}','${c.id}',-1)">−</button>
              <div class="qty-value" id="${containerId}-qty-${c.id}">0</div>
              <button class="qty-btn" onclick="changeQty('${containerId}','${c.id}',1)">＋</button>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">📸 Fotos (opcional)</label>
      <div class="photo-grid" id="${containerId}-photos">
        <div class="photo-add" onclick="triggerPhoto('${containerId}')">
          <span style="font-size:24px">📷</span>
          <span>Agregar</span>
        </div>
      </div>
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px;" onclick="saveForm('${containerId}')">
      💾 Guardar Registro
    </button>
  `;

  // photo handler
  const photoInput = document.getElementById('photoInput');
  photoInput._target = containerId;
  photoInput.onchange = function() {
    const files = Array.from(this.files);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = e => {
        if (!window._formPhotos) window._formPhotos = {};
        if (!window._formPhotos[containerId]) window._formPhotos[containerId] = [];
        window._formPhotos[containerId].push(e.target.result);
        renderPhotoGrid(containerId);
      };
      reader.readAsDataURL(file);
    });
    this.value = '';
  };
}

function changeQty(prefix, catId, delta) {
  const el = document.getElementById(prefix + '-qty-' + catId);
  let v = parseInt(el.textContent) + delta;
  if (v < 0) v = 0;
  el.textContent = v;
}

function triggerPhoto(prefix) {
  const inp = document.getElementById('photoInput');
  inp._target = prefix;
  inp.click();
}

function renderPhotoGrid(prefix) {
  const photos = (window._formPhotos || {})[prefix] || [];
  const grid = document.getElementById(prefix + '-photos');
  if (!grid) return;
  grid.innerHTML = photos.map((p, i) => `
    <div class="photo-thumb">
      <img src="${p}" onclick="openLightbox('${p.replace(/'/g,"\\'")}')"/>
      <button class="del-photo" onclick="delPhoto('${prefix}',${i})">✕</button>
    </div>
  `).join('') + `
    <div class="photo-add" onclick="triggerPhoto('${prefix}')">
      <span style="font-size:24px">📷</span>
      <span>Agregar</span>
    </div>
  `;
}

function delPhoto(prefix, idx) {
  if (!window._formPhotos) return;
  window._formPhotos[prefix].splice(idx, 1);
  renderPhotoGrid(prefix);
}

function saveForm(prefix) {
  const fecha = document.getElementById(prefix + '-fecha')?.value;
  if (!fecha) { showToast('❌ Selecciona una fecha', 'error'); return; }

  const items = {};
  let total = 0;
  CATEGORIAS.forEach(c => {
    const v = parseInt(document.getElementById(prefix + '-qty-' + c.id)?.textContent || '0');
    items[c.id] = v;
    total += v;
  });

  if (total === 0) { showToast('⚠️ Agrega al menos una prenda', 'warn'); return; }

  const nota = document.getElementById(prefix + '-nota')?.value || '';
  const photos = (window._formPhotos || {})[prefix] || [];

  const db = loadDB();
  db.unshift({
    id: Date.now(),
    fecha,
    nota,
    items,
    photos,
    createdAt: new Date().toISOString()
  });
  saveDB(db);

  if (window._formPhotos) window._formPhotos[prefix] = [];

  closeModal();
  showToast('✓ Registro guardado');
  renderDashboard();
  renderHistorial();
  renderCategorias();
  buildForm(prefix); // reset
}

// ===== DASHBOARD =====
function renderDashboard() {
  const db = loadDB();
  const now = new Date();
  document.getElementById('fecha-hoy').textContent = now.toLocaleDateString('es-MX', { weekday:'long', year:'numeric', month:'long', day:'numeric' }).toUpperCase();

  // stats
  let totalPrendas = 0;
  const catTotals = {};
  CATEGORIAS.forEach(c => { catTotals[c.id] = 0; });
  db.forEach(r => {
    CATEGORIAS.forEach(c => {
      const v = r.items[c.id] || 0;
      catTotals[c.id] += v;
      totalPrendas += v;
    });
  });

  const diasActivos = new Set(db.map(r => r.fecha)).size;
  const stockBajo = CATEGORIAS.filter(c => c.alerta > 0 && catTotals[c.id] < c.alerta).length;

  document.getElementById('stat-total').textContent = totalPrendas;
  document.getElementById('stat-registros').textContent = db.length;
  document.getElementById('stat-dias').textContent = diasActivos;
  document.getElementById('stat-bajo').textContent = stockBajo;

  // alertas
  const alertasEl = document.getElementById('alertas-container');
  const bajos = CATEGORIAS.filter(c => c.alerta > 0 && catTotals[c.id] < c.alerta);
  if (bajos.length) {
    alertasEl.innerHTML = bajos.map(c => `
      <div class="alert-badge">
        ⚠️ ${c.emoji} ${c.nombre}: solo ${catTotals[c.id]} prendas
      </div><br/>
    `).join('');
  } else {
    alertasEl.innerHTML = '';
  }

  // cats
  const dcEl = document.getElementById('dashboard-cats');
  dcEl.innerHTML = CATEGORIAS.filter(c => catTotals[c.id] > 0).map(c => `
    <div class="category-row">
      <div class="category-emoji">${c.emoji}</div>
      <div class="category-name">${c.nombre}</div>
      <div style="font-family:var(--mono);font-weight:700;color:var(--accent);font-size:16px;">${catTotals[c.id]}</div>
    </div>
  `).join('') || '<p style="color:var(--muted);font-size:14px;padding:8px 0;">Sin prendas registradas aún.</p>';

  // último registro
  const urEl = document.getElementById('ultimo-registro');
  if (db.length === 0) {
    urEl.innerHTML = `<div class="empty-state" style="padding:20px 0;"><div class="emoji">📭</div><p>Sin registros aún</p></div>`;
  } else {
    const r = db[0];
    const cats = CATEGORIAS.filter(c => r.items[c.id] > 0);
    urEl.innerHTML = `
      <div style="font-family:var(--mono);color:var(--accent);font-size:13px;margin-bottom:8px;">${formatFecha(r.fecha)}</div>
      ${cats.map(c => `<span class="tag">${c.emoji} ${c.nombre}: ${r.items[c.id]}</span>`).join('')}
      ${r.nota ? `<p style="font-size:13px;color:var(--muted);margin-top:10px;">${r.nota}</p>` : ''}
    `;
  }
}

// ===== HISTORIAL =====
function renderHistorial() {
  const db = loadDB();
  const q = (document.getElementById('search-input')?.value || '').toLowerCase();
  const el = document.getElementById('historial-list');

  let filtered = db;
  if (q) {
    filtered = db.filter(r => {
      const fechaStr = r.fecha + ' ' + formatFecha(r.fecha).toLowerCase();
      const cats = CATEGORIAS.filter(c => r.items[c.id] > 0).map(c => c.nombre.toLowerCase()).join(' ');
      return (fechaStr + ' ' + cats + ' ' + (r.nota || '').toLowerCase()).includes(q);
    });
  }

  if (filtered.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="emoji">🔍</div><h3>Sin resultados</h3><p>Prueba otra búsqueda o agrega tu primer registro</p></div>`;
    return;
  }

  el.innerHTML = filtered.map((r, i) => {
    const d = new Date(r.fecha + 'T12:00:00');
    const dia = d.getDate();
    const mes = d.toLocaleDateString('es-MX', { month:'short' }).toUpperCase();
    const cats = CATEGORIAS.filter(c => r.items[c.id] > 0);
    const total = cats.reduce((s, c) => s + r.items[c.id], 0);
    return `
      <div class="registro-item" id="reg-${r.id}" onclick="toggleReg('${r.id}')">
        <div class="reg-header">
          <div class="reg-date-box">
            <div class="reg-day">${dia}</div>
            <div class="reg-month">${mes}</div>
          </div>
          <div class="reg-info">
            <div class="reg-title">${total} prendas registradas</div>
            <div class="reg-summary">${cats.slice(0,3).map(c=>`${c.emoji} ${c.nombre}`).join(' · ')}${cats.length>3?' · …':''}</div>
          </div>
          <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteReg('${r.id}')">🗑</button>
        </div>
        <div class="reg-detail">
          <div class="detail-grid">
            ${cats.map(c => `
              <div class="detail-chip">
                <span>${c.emoji}</span>
                <span>${c.nombre}</span>
                <span class="detail-chip-qty">${r.items[c.id]}</span>
              </div>
            `).join('')}
          </div>
          ${r.nota ? `<p style="font-size:13px;color:var(--muted);margin-bottom:12px;">📝 ${r.nota}</p>` : ''}
          ${r.photos && r.photos.length ? `
            <div class="card-title">📸 Fotos</div>
            <div class="photo-grid">
              ${r.photos.map(p => `
                <div class="photo-thumb">
                  <img src="${p}" onclick="event.stopPropagation();openLightbox('${p.replace(/'/g,"\\'")}')" />
                </div>
              `).join('')}
            </div>
          ` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function toggleReg(id) {
  document.getElementById('reg-' + id)?.classList.toggle('expanded');
}

function deleteReg(id) {
  if (!confirm('¿Eliminar este registro?')) return;
  let db = loadDB();
  db = db.filter(r => String(r.id) !== String(id));
  saveDB(db);
  renderHistorial();
  renderDashboard();
  renderCategorias();
  showToast('🗑 Registro eliminado');
}

// ===== CATEGORIAS =====
function renderCategorias() {
  const db = loadDB();
  const catTotals = {};
  CATEGORIAS.forEach(c => { catTotals[c.id] = 0; });
  db.forEach(r => { CATEGORIAS.forEach(c => { catTotals[c.id] += (r.items[c.id] || 0); }); });

  document.getElementById('cat-list').innerHTML = CATEGORIAS.map(c => {
    const total = catTotals[c.id];
    const bajo = c.alerta > 0 && total < c.alerta;
    return `
      <div class="cat-card" style="${bajo ? 'border-color:rgba(255,107,71,0.5);' : ''}">
        <div class="cat-emoji-big">${c.emoji}</div>
        <div class="cat-info">
          <div class="cat-info-name">${c.nombre}</div>
          <div class="cat-info-total">${bajo ? '⚠️ Stock bajo — mín. '+c.alerta : (total > 0 ? 'Acumulado total' : 'Sin registros')}</div>
        </div>
        <div class="cat-badge" style="${bajo ? 'color:var(--accent3);' : ''}">${total}</div>
      </div>
    `;
  }).join('');
}

// ===== INLINE FORM =====
function renderFormInline() {
  document.getElementById('form-inline').innerHTML = '';
  buildForm('form-inline');
}

// ===== MODAL =====
function openModal() {
  document.getElementById('modal-form-body').innerHTML = '';
  buildForm('modal-form-body');
  document.getElementById('modal').classList.add('open');
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
}
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ===== LIGHTBOX =====
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

// ===== TOAST =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== UTILS =====
function formatFecha(f) {
  const d = new Date(f + 'T12:00:00');
  return d.toLocaleDateString('es-MX', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}

// ===== INIT =====
renderDashboard();
</script>
</body>
</html>
